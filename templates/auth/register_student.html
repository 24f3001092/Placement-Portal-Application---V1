{% extends 'base.html' %}
{% block title %}Student Registration{% endblock %}
{% block content %}
<div class="page-form-auth">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white py-3">
            <h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Student Registration</h5>
        </div>
        <div class="card-body p-4">
            <form method="POST" enctype="multipart/form-data" novalidate>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="student_name">Full Name <span class="text-danger">*</span></label>
                        <input id="student_name" type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="student_email">Email <span class="text-danger">*</span></label>
                        <input id="student_email" type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="student_phone">Phone</label>
                        <input id="student_phone" type="text" name="phone" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="student_password">Password <span class="text-danger">*</span></label>
                        <input id="student_password" type="password" name="password" class="form-control" required minlength="6">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="student_confirm_password">Confirm Password <span class="text-danger">*</span></label>
                        <input id="student_confirm_password" type="password" name="confirm_password" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="student_department">Department</label>
                        <input id="student_department" type="text" name="department" class="form-control" placeholder="e.g. CSE, ECE">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold" for="student_year">Year of Study</label>
                        <select id="student_year" name="year_of_study" class="form-select" title="Select year of study">
                            <option value="">Select</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                            <option>Final Year</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold" for="student_cgpa">CGPA</label>
                        <input id="student_cgpa" type="number" name="cgpa" class="form-control" step="0.01" min="0" max="10">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="student_skills">Skills</label>
                        <input id="student_skills" type="text" name="skills" class="form-control" placeholder="e.g. Python, Java, ML, SQL">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="student_resume">Upload Resume (PDF)</label>
                        <input id="student_resume" type="file" name="resume" class="form-control" accept=".pdf,.doc,.docx">
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4">Register</button>
                        <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary">Back to Login</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
