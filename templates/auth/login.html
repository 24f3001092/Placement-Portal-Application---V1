{% extends 'base.html' %}
{% block title %}Login - Placement Portal{% endblock %}
{% block content %}
<div class="login-card">
    <div class="card shadow-sm">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="login-logo mb-2"><i class="bi bi-mortarboard-fill"></i></div>
                <h3 class="fw-bold">Placement Portal</h3>
                <p class="text-muted">Sign in to your account</p>
            </div>
            <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="role">Role</label>
                    <select id="role" name="role" class="form-select" title="Select your role" required>
                        <option value="">Select your role</option>
                        <option value="admin">Admin (Institute)</option>
                        <option value="company">Company</option>
                        <option value="student">Student</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <hr class="my-4">
            <div class="text-center">
                <p class="text-muted mb-2">Don't have an account?</p>
                <a href="{{ url_for('auth.register_student') }}" class="btn btn-outline-success me-2">
                    <i class="bi bi-person-plus me-1"></i>Student Register
                </a>
                <a href="{{ url_for('auth.register_company') }}" class="btn btn-outline-primary">
                    <i class="bi bi-building-add me-1"></i>Company Register
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
