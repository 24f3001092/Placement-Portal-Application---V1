{% extends 'base.html' %}
{% block title %}Edit Student{% endblock %}
{% block content %}
<div class="page-form-shell">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white py-3">
            <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i>Edit Student</h5>
        </div>
        <div class="card-body p-4">
            <form method="POST" novalidate>
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="name">Full Name</label>
                        <input id="name" type="text" name="name" class="form-control" value="{{ student.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="email">Email</label>
                        <input id="email" type="email" name="email" class="form-control" value="{{ student.email }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="phone">Phone</label>
                        <input id="phone" type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" for="department">Department</label>
                        <input id="department" type="text" name="department" class="form-control" value="{{ student.department or '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold" for="year_of_study">Year of Study</label>
                        <input id="year_of_study" type="text" name="year_of_study" class="form-control" value="{{ student.year_of_study or '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold" for="cgpa">CGPA</label>
                        <input id="cgpa" type="number" name="cgpa" class="form-control" step="0.01" min="0" max="10" value="{{ student.cgpa or '' }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" for="skills">Skills</label>
                        <input id="skills" type="text" name="skills" class="form-control" value="{{ student.skills or '' }}">
                    </div>
                    <div class="col-12 form-check mt-2 ms-2">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if student.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Active account</label>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-success px-4">Save Changes</button>
                        <a href="{{ url_for('admin.students') }}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
